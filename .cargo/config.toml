# .cargo/config.toml
# Xtensa LX6 target for ESP32 (classic)
# For ESP32-S3 (Xtensa LX7): xtensa-esp32s3-espidf
# For ESP32-C3 (RISC-V): riscv32imc-esp-espidf

[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# Pass ESP-IDF build flags
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
]

[unstable]
build-std = ["std", "panic_abort"]

[env]
# ESP-IDF version to use (can also be "master" or a git tag)
ESP_IDF_VERSION = "v5.1.4"
# Enable standard library compilation
CARGO_UNSTABLE_BUILD_STD = "true"
# Use custom ESP-IDF SDK defaults to select a larger single-app partition.
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults"
